name: Mini32 regression

on:
  push:
    branches: [master, feature/fpga-platform]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make python3 iverilog verilator
      - name: C++ regression
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Python regression
        run: |
          python3 -m compileall assembler verification rtl/tools
          python3 -m unittest discover -s tests/python -p "test_*.py"
          python3 -m unittest discover -s verification/tests -p "test_*.py"
      - name: RTL regression
        run: |
          make -C rtl clean
          make -C rtl lint
          make -C rtl test
      - name: Architectural differential verification
        run: python3 verification/differential.py --suite
